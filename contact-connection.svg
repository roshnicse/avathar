<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="100%" height="100%">
  <defs>
    <linearGradient id="cnt-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00BFFF" />
      <stop offset="100%" stop-color="#7B2CBF" />
    </linearGradient>
  </defs>
  <rect width="500" height="350" rx="16" fill="#040c1d" />

  <!-- Global Connectivity Hub -->
  <circle cx="250" cy="175" r="120" fill="none" stroke="rgba(0,191,255,0.15)" stroke-width="1.5" />
  <circle cx="250" cy="175" r="80" fill="none" stroke="rgba(0,191,255,0.25)" stroke-width="1.5" stroke-dasharray="6 6" />

  <!-- Central Location Node: Karur Academy -->
  <g transform="translate(250, 175)">
    <!-- Ping ripples -->
    <circle cx="0" cy="0" r="30" fill="rgba(0,191,255,0.2)" />
    <circle cx="0" cy="0" r="16" fill="#0759C7" stroke="#00BFFF" stroke-width="2.5" />
    <!-- Pin Icon -->
    <path d="M0 -7 C-4 -7 -6 -5 -6 -1 C-6 4 0 9 0 9 C0 9 6 4 6 -1 C6 -5 4 -7 0 -7 Z" fill="#F5C451" />
    <circle cx="0" cy="-3" r="1.5" fill="#030712" />
  </g>

  <!-- Online & Offline Hybrid Waves -->
  <!-- WhatsApp / Communication Satellite Node -->
  <g transform="translate(130, 95)">
    <circle cx="0" cy="0" r="24" fill="#07152F" stroke="#25D366" stroke-width="2" />
    <path d="M-6 -6 C-9 -3 -9 3 -6 6 C-3 9 3 9 6 6 L8 8 L7 5 C9 3 9 -3 6 -6 Z" fill="#25D366" />
    <text x="0" y="38" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="700" text-anchor="middle">9751205260</text>
  </g>
  <line x1="150" y1="110" x2="235" y2="160" stroke="#25D366" stroke-width="1.5" stroke-dasharray="4 3" />

  <!-- Karur Physical Hub Node -->
  <g transform="translate(370, 95)">
    <circle cx="0" cy="0" r="24" fill="#07152F" stroke="#F5C451" stroke-width="2" />
    <rect x="-8" y="-8" width="16" height="16" rx="2" fill="none" stroke="#F5C451" stroke-width="1.8" />
    <text x="0" y="38" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="700" text-anchor="middle">KARUR FACILITY</text>
    <text x="0" y="50" fill="#B8C7E0" font-family="'Space Grotesk', sans-serif" font-size="8" text-anchor="middle">31, Velammal Layout</text>
  </g>
  <line x1="350" y1="110" x2="265" y2="160" stroke="#F5C451" stroke-width="1.5" stroke-dasharray="4 3" />

  <!-- Bottom Online Learning Node -->
  <g transform="translate(250, 275)">
    <rect x="-70" y="0" width="140" height="28" rx="14" fill="#07152F" stroke="#00BFFF" stroke-width="1.5" />
    <circle cx="-50" cy="14" r="4" fill="#25D366" />
    <text x="6" y="18" fill="#00BFFF" font-family="'Space Grotesk', sans-serif" font-size="9" font-weight="700" text-anchor="middle">ONLINE &amp; OFFLINE</text>
  </g>
</svg>
