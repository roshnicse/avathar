<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07152F" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="cyberBlueIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00BFFF" />
      <stop offset="100%" stop-color="#0759C7" />
    </linearGradient>
    <linearGradient id="goldGlowIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="100%" stop-color="#F5C451" />
    </linearGradient>
    <filter id="neonFavGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="100" height="100" rx="22" fill="url(#favBg)" stroke="#0759C7" stroke-width="2" />
  
  <!-- Hexagon border -->
  <polygon points="50,10 86,29 86,71 50,90 14,71 14,29" fill="none" stroke="#00BFFF" stroke-width="1.8" opacity="0.7" />
  
  <!-- Stylized Futuristic 'A' -->
  <path d="M50 20 L26 78 L36 78 L50 42 Z" fill="url(#cyberBlueIcon)" />
  <path d="M50 20 L74 78 L64 78 L50 42 Z" fill="url(#goldGlowIcon)" />
  
  <!-- Neural Bridge -->
  <path d="M34 58 L66 58" stroke="url(#goldGlowIcon)" stroke-width="3.5" stroke-linecap="round" filter="url(#neonFavGlow)" />
  
  <!-- Glowing Nodes -->
  <circle cx="50" cy="20" r="4.5" fill="#FFE082" filter="url(#neonFavGlow)" />
  <circle cx="26" cy="78" r="3.5" fill="#00BFFF" />
  <circle cx="74" cy="78" r="3.5" fill="#F5C451" />
  <circle cx="50" cy="58" r="3" fill="#FFFFFF" />
  
  <!-- Tech nodes -->
  <line x1="50" y1="20" x2="36" y2="32" stroke="#00BFFF" stroke-width="1.5" />
  <line x1="50" y1="20" x2="64" y2="32" stroke="#FFE082" stroke-width="1.5" />
  <circle cx="36" cy="32" r="2" fill="#00BFFF" />
  <circle cx="64" cy="32" r="2" fill="#F5C451" />
</svg>
