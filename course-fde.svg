<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="fde-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00BFFF" />
      <stop offset="100%" stop-color="#7B2CBF" />
    </linearGradient>
  </defs>
  <rect width="400" height="240" rx="14" fill="#040c1d" />

  <!-- Deployment Gear System + AI Node Integration -->
  <!-- Main Enterprise Gear -->
  <g transform="translate(140, 115)">
    <circle cx="0" cy="0" r="42" fill="none" stroke="#00BFFF" stroke-width="8" stroke-dasharray="14 12" />
    <circle cx="0" cy="0" r="28" fill="#07152F" stroke="#0759C7" stroke-width="2" />
    <!-- Center AI Core -->
    <circle cx="0" cy="0" r="12" fill="url(#fde-grad)" />
  </g>

  <!-- Secondary Gear -->
  <g transform="translate(230, 80)">
    <circle cx="0" cy="0" r="28" fill="none" stroke="#F5C451" stroke-width="6" stroke-dasharray="10 8" />
    <circle cx="0" cy="0" r="18" fill="#07152F" stroke="#F5C451" stroke-width="1.5" />
    <circle cx="0" cy="0" r="8" fill="#F5C451" />
  </g>

  <!-- High-Speed Interconnect Bus Line -->
  <path d="M50 170 L140 115 L230 80 L340 150" fill="none" stroke="#00BFFF" stroke-width="2.5" stroke-dasharray="5 5" />
  <circle cx="50" cy="170" r="6" fill="#00BFFF" />
  <circle cx="340" cy="150" r="6" fill="#7B2CBF" />

  <!-- Code Implementation Terminal Card -->
  <rect x="250" y="145" width="125" height="55" rx="6" fill="#030712" stroke="rgba(0,191,255,0.3)" />
  <text x="260" y="163" fill="#25D366" font-family="monospace" font-size="9">> deploy --prod</text>
  <text x="260" y="177" fill="#00BFFF" font-family="monospace" font-size="9">AI_ENG: READY</text>
  <text x="260" y="191" fill="#FFE082" font-family="monospace" font-size="9">LATENCY: 12ms</text>
</svg>
