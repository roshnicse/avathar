<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="100%" height="100%">
  <defs>
    <linearGradient id="mob-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0759C7" />
      <stop offset="100%" stop-color="#7B2CBF" />
    </linearGradient>
  </defs>
  <rect width="400" height="220" rx="14" fill="#040c1d" />

  <!-- Dual Smartphones (Android & iOS Perspective) -->
  <!-- Left Phone -->
  <g transform="translate(115, 20)">
    <rect x="0" y="0" width="95" height="175" rx="14" fill="#07152F" stroke="#00BFFF" stroke-width="2" />
    <rect x="30" y="4" width="35" height="4" rx="2" fill="#030712" />
    <!-- App UI -->
    <rect x="8" y="16" width="79" height="35" rx="6" fill="url(#mob-card)" />
    <text x="14" y="32" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="8" font-weight="700">AI ASSISTANT</text>
    <circle cx="68" cy="33" r="10" fill="#F5C451" />
    
    <!-- Feed items -->
    <rect x="8" y="58" width="79" height="24" rx="4" fill="#030712" stroke="rgba(0,191,255,0.2)" />
    <circle cx="20" cy="70" r="5" fill="#00BFFF" />
    <rect x="30" y="66" width="45" height="4" rx="2" fill="#FFFFFF" />
    <rect x="30" y="73" width="30" height="3" rx="1.5" fill="#B8C7E0" />

    <rect x="8" y="88" width="79" height="24" rx="4" fill="#030712" stroke="rgba(245,196,81,0.2)" />
    <circle cx="20" cy="100" r="5" fill="#F5C451" />
    <rect x="30" y="96" width="45" height="4" rx="2" fill="#FFFFFF" />
    <rect x="30" y="103" width="30" height="3" rx="1.5" fill="#B8C7E0" />

    <!-- Bottom Navigation Bar -->
    <rect x="8" y="145" width="79" height="18" rx="4" fill="#0A1E46" />
    <circle cx="25" cy="154" r="3" fill="#00BFFF" />
    <circle cx="48" cy="154" r="3" fill="#F5C451" />
    <circle cx="70" cy="154" r="3" fill="#B8C7E0" />
  </g>

  <!-- Right Phone (Offset angle) -->
  <g transform="translate(205, 35)">
    <rect x="0" y="0" width="85" height="155" rx="12" fill="#030712" stroke="#F5C451" stroke-width="1.8" />
    <circle cx="42" cy="70" r="24" fill="none" stroke="#F5C451" stroke-width="3" stroke-dasharray="8 6" />
    <text x="42" y="75" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="700" text-anchor="middle">iOS/APK</text>
    <rect x="15" y="115" width="55" height="16" rx="8" fill="#00BFFF" />
    <text x="42" y="126" fill="#030712" font-family="'Space Grotesk', sans-serif" font-size="7" font-weight="800" text-anchor="middle">LAUNCH</text>
  </g>
</svg>
