<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="ds-bar" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0759C7" />
      <stop offset="100%" stop-color="#00BFFF" />
    </linearGradient>
    <linearGradient id="ds-curve" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00BFFF" />
      <stop offset="50%" stop-color="#F5C451" />
      <stop offset="100%" stop-color="#7B2CBF" />
    </linearGradient>
  </defs>
  <rect width="400" height="240" rx="14" fill="#040c1d" />

  <!-- Dashboard Container -->
  <rect x="25" y="25" width="350" height="190" rx="8" fill="#07152F" stroke="rgba(0, 191, 255, 0.25)" stroke-width="1.5" />
  
  <!-- Header Bar -->
  <rect x="25" y="25" width="350" height="28" rx="8" fill="#0A1E46" />
  <circle cx="45" cy="39" r="4" fill="#FF5C5C" />
  <circle cx="58" cy="39" r="4" fill="#F5C451" />
  <circle cx="71" cy="39" r="4" fill="#25D366" />
  <text x="92" y="43" fill="#B8C7E0" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="600">DATA_ANALYTICS_PYTHON_STUDIO</text>

  <!-- Left: Bar Chart Visualizer -->
  <g transform="translate(50, 70)">
    <!-- Grid lines -->
    <line x1="0" y1="100" x2="140" y2="100" stroke="rgba(255,255,255,0.15)" />
    <line x1="0" y1="70" x2="140" y2="70" stroke="rgba(255,255,255,0.08)" stroke-dasharray="3 3" />
    <line x1="0" y1="40" x2="140" y2="40" stroke="rgba(255,255,255,0.08)" stroke-dasharray="3 3" />
    <line x1="0" y1="10" x2="140" y2="10" stroke="rgba(255,255,255,0.08)" stroke-dasharray="3 3" />

    <!-- Bars -->
    <rect x="10" y="45" width="18" height="55" rx="3" fill="url(#ds-bar)" />
    <rect x="38" y="25" width="18" height="75" rx="3" fill="url(#ds-bar)" />
    <rect x="66" y="55" width="18" height="45" rx="3" fill="url(#ds-bar)" />
    <rect x="94" y="15" width="18" height="85" rx="3" fill="#F5C451" />
    <rect x="122" y="35" width="18" height="65" rx="3" fill="url(#ds-bar)" />
  </g>

  <!-- Right: Predictive Analytics Trend Curve -->
  <g transform="translate(210, 70)">
    <rect x="0" y="0" width="145" height="105" rx="6" fill="#030712" stroke="rgba(0, 191, 255, 0.15)" />
    <path d="M10 85 Q 40 70, 65 45 T 135 20" fill="none" stroke="url(#ds-curve)" stroke-width="3" />
    <!-- Data points -->
    <circle cx="10" cy="85" r="3.5" fill="#00BFFF" />
    <circle cx="50" cy="62" r="3.5" fill="#FFE082" />
    <circle cx="85" cy="38" r="4" fill="#F5C451" />
    <circle cx="135" cy="20" r="4.5" fill="#9D4EDD" />
    <!-- Python Glyph Tag -->
    <rect x="10" y="10" width="54" height="16" rx="3" fill="rgba(0,191,255,0.15)" />
    <text x="16" y="22" fill="#00BFFF" font-family="monospace" font-size="9" font-weight="700">pandas.df</text>
  </g>

  <!-- Bottom Metric Ticker -->
  <g transform="translate(50, 190)">
    <text x="0" y="12" fill="#FFE082" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700">ACCURACY: 98.4%</text>
    <text x="140" y="12" fill="#00BFFF" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700">DATASETS: PROCESSED</text>
  </g>
</svg>
