<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="100%" height="100%">
  <defs>
    <linearGradient id="vlsi-die" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00BFFF" />
      <stop offset="50%" stop-color="#0759C7" />
      <stop offset="100%" stop-color="#7B2CBF" />
    </linearGradient>
    <linearGradient id="vlsi-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="100%" stop-color="#F5C451" />
    </linearGradient>
  </defs>
  <rect width="400" height="220" rx="14" fill="#040c1d" />

  <!-- Silicon Wafer / Semiconductor Die -->
  <rect x="90" y="30" width="220" height="160" rx="10" fill="#07152F" stroke="#00BFFF" stroke-width="2" />
  
  <!-- Outer Gold Wire-Bond Leads -->
  <g fill="url(#vlsi-gold)">
    <!-- Top & Bottom Pins -->
    <rect x="110" y="20" width="6" height="12" /><rect x="130" y="20" width="6" height="12" />
    <rect x="150" y="20" width="6" height="12" /><rect x="170" y="20" width="6" height="12" />
    <rect x="190" y="20" width="6" height="12" /><rect x="210" y="20" width="6" height="12" />
    <rect x="230" y="20" width="6" height="12" /><rect x="250" y="20" width="6" height="12" />
    <rect x="270" y="20" width="6" height="12" />

    <rect x="110" y="188" width="6" height="12" /><rect x="130" y="188" width="6" height="12" />
    <rect x="150" y="188" width="6" height="12" /><rect x="170" y="188" width="6" height="12" />
    <rect x="190" y="188" width="6" height="12" /><rect x="210" y="188" width="6" height="12" />
    <rect x="230" y="188" width="6" height="12" /><rect x="250" y="188" width="6" height="12" />
    <rect x="270" y="188" width="6" height="12" />
  </g>

  <!-- Central Silicon Core Grid (Nanometer Gate Arrays) -->
  <rect x="130" y="55" width="140" height="110" rx="4" fill="#030712" stroke="url(#vlsi-die)" stroke-width="2" />
  
  <!-- Gate Array Logic Interconnects -->
  <g opacity="0.4" stroke="#00BFFF" stroke-width="1">
    <line x1="145" y1="55" x2="145" y2="165" /><line x1="165" y1="55" x2="165" y2="165" />
    <line x1="185" y1="55" x2="185" y2="165" /><line x1="205" y1="55" x2="205" y2="165" />
    <line x1="225" y1="55" x2="225" y2="165" /><line x1="245" y1="55" x2="245" y2="165" />
    
    <line x1="130" y1="75" x2="270" y2="75" /><line x1="130" y1="95" x2="270" y2="95" />
    <line x1="130" y1="115" x2="270" y2="115" /><line x1="130" y1="135" x2="270" y2="135" />
  </g>

  <!-- Core Label -->
  <rect x="160" y="95" width="80" height="30" rx="4" fill="#07152F" stroke="#F5C451" stroke-width="1.5" />
  <text x="200" y="114" fill="#F5C451" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="800" text-anchor="middle">VLSI_ASIC</text>
</svg>
