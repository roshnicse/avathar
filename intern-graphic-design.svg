<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="100%" height="100%">
  <defs>
    <linearGradient id="gd-wheel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5C5C" />
      <stop offset="33%" stop-color="#F5C451" />
      <stop offset="66%" stop-color="#00BFFF" />
      <stop offset="100%" stop-color="#9D4EDD" />
    </linearGradient>
  </defs>
  <rect width="400" height="220" rx="14" fill="#040c1d" />

  <!-- Color Palette Wheel -->
  <g transform="translate(120, 110)">
    <circle cx="0" cy="0" r="50" fill="none" stroke="url(#gd-wheel)" stroke-width="14" />
    <circle cx="0" cy="0" r="30" fill="#07152F" stroke="#00BFFF" stroke-width="1.5" />
    <path d="M-8 -8 L8 8 M-8 8 L8 -8" stroke="#F5C451" stroke-width="2" />
  </g>

  <!-- Vector Pen & Typography Layers -->
  <g transform="translate(210, 45)">
    <!-- Canvas Frame -->
    <rect x="0" y="0" width="140" height="125" rx="6" fill="#07152F" stroke="rgba(245,196,81,0.3)" />
    <!-- Golden Spiral / Bezier Curve -->
    <path d="M15 105 C20 40, 90 20, 120 70" fill="none" stroke="#F5C451" stroke-width="3" />
    <circle cx="15" cy="105" r="4" fill="#00BFFF" />
    <circle cx="120" cy="70" r="4" fill="#FFE082" />
    
    <!-- Stylized 'A' Vector Glyph -->
    <text x="68" y="75" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="34" font-weight="900" opacity="0.9">A</text>
    
    <!-- Color Swatches -->
    <rect x="15" y="100" width="16" height="12" rx="2" fill="#00BFFF" />
    <rect x="35" y="100" width="16" height="12" rx="2" fill="#F5C451" />
    <rect x="55" y="100" width="16" height="12" rx="2" fill="#7B2CBF" />
    <rect x="75" y="100" width="16" height="12" rx="2" fill="#25D366" />
  </g>
</svg>
