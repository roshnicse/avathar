<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 380" role="img" aria-label="AI Technology Learning Environment">
  <defs>
    <radialGradient id="bgG" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#071F4F" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#030712"/>
    </radialGradient>
    <filter id="glow2"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="screenG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D2757"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
  </defs>
  <rect width="480" height="380" fill="url(#bgG)" rx="14"/>

  <!-- Central laptop body -->
  <rect x="110" y="90" width="260" height="170" rx="8" fill="#0A1A35" stroke="#00BFFF" stroke-width="1.2" stroke-opacity="0.5"/>
  <rect x="120" y="100" width="240" height="150" rx="5" fill="url(#screenG)"/>

  <!-- Screen: code lines animated -->
  <rect x="130" y="112" width="140" height="5" rx="2" fill="#00BFFF" fill-opacity="0.6"><animate attributeName="width" values="140;80;140" dur="3.5s" repeatCount="indefinite"/></rect>
  <rect x="130" y="122" width="100" height="5" rx="2" fill="#F5C451" fill-opacity="0.5"><animate attributeName="width" values="100;160;100" dur="4s" repeatCount="indefinite" begin="0.3s"/></rect>
  <rect x="148" y="132" width="120" height="5" rx="2" fill="#00BFFF" fill-opacity="0.4"><animate attributeName="width" values="120;70;120" dur="3.8s" repeatCount="indefinite" begin="0.7s"/></rect>
  <rect x="130" y="142" width="90" height="5" rx="2" fill="#A855F7" fill-opacity="0.45"><animate attributeName="width" values="90;140;90" dur="4.2s" repeatCount="indefinite" begin="1.1s"/></rect>
  <rect x="148" y="152" width="130" height="5" rx="2" fill="#00BFFF" fill-opacity="0.5"><animate attributeName="width" values="130;60;130" dur="3.6s" repeatCount="indefinite" begin="1.5s"/></rect>
  <rect x="130" y="162" width="80" height="5" rx="2" fill="#F5C451" fill-opacity="0.4"><animate attributeName="width" values="80;120;80" dur="4.5s" repeatCount="indefinite" begin="1.9s"/></rect>
  <rect x="148" y="172" width="110" height="5" rx="2" fill="#00BFFF" fill-opacity="0.35"><animate attributeName="width" values="110;75;110" dur="3.9s" repeatCount="indefinite" begin="0.5s"/></rect>
  <rect x="130" y="182" width="95" height="5" rx="2" fill="#A855F7" fill-opacity="0.4"><animate attributeName="width" values="95;145;95" dur="4.1s" repeatCount="indefinite" begin="2.3s"/></rect>

  <!-- Neural graph right side of screen -->
  <g transform="translate(282, 105)">
    <circle cx="30" cy="25" r="5" fill="#00BFFF" filter="url(#glow2)"><animate attributeName="r" values="5;7;5" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="55" cy="45" r="4.5" fill="#F5C451" filter="url(#glow2)"><animate attributeName="r" values="4.5;6.5;4.5" dur="3s" repeatCount="indefinite" begin="0.4s"/></circle>
    <circle cx="30" cy="65" r="5" fill="#00BFFF" filter="url(#glow2)"><animate attributeName="r" values="5;7;5" dur="2.8s" repeatCount="indefinite" begin="0.8s"/></circle>
    <circle cx="60" cy="85" r="4.5" fill="#A855F7" filter="url(#glow2)"><animate attributeName="r" values="4.5;6.5;4.5" dur="3.4s" repeatCount="indefinite" begin="1.2s"/></circle>
    <circle cx="28" cy="105" r="5" fill="#00BFFF" filter="url(#glow2)"><animate attributeName="r" values="5;7;5" dur="2.6s" repeatCount="indefinite" begin="1.6s"/></circle>
    <circle cx="56" cy="125" r="4" fill="#F5C451" filter="url(#glow2)"><animate attributeName="r" values="4;6;4" dur="3.2s" repeatCount="indefinite" begin="0.2s"/></circle>
    <line x1="30" y1="25" x2="55" y2="45" stroke="#00BFFF" stroke-opacity="0.4" stroke-width="1"/>
    <line x1="55" y1="45" x2="30" y2="65" stroke="#F5C451" stroke-opacity="0.3" stroke-width="1"/>
    <line x1="30" y1="65" x2="60" y2="85" stroke="#00BFFF" stroke-opacity="0.35" stroke-width="1"/>
    <line x1="60" y1="85" x2="28" y2="105" stroke="#A855F7" stroke-opacity="0.3" stroke-width="1"/>
    <line x1="28" y1="105" x2="56" y2="125" stroke="#00BFFF" stroke-opacity="0.4" stroke-width="1"/>
    <!-- Pulse dot -->
    <circle r="3" fill="#00BFFF" filter="url(#glow2)">
      <animateMotion path="M30,25 L55,45 L30,65 L60,85 L28,105 L56,125" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Laptop base/keyboard -->
  <rect x="95" y="260" width="290" height="20" rx="4" fill="#060E1E" stroke="#1A3060" stroke-width="1.2"/>
  <rect x="175" y="260" width="130" height="5" rx="2" fill="#0A1A35"/>
  <ellipse cx="240" cy="263" rx="20" ry="3" fill="#0D2040"/>

  <!-- Floating tech cards around laptop -->
  <!-- Left card: AI Badge -->
  <rect x="25" y="145" width="72" height="50" rx="8" fill="#07152F" stroke="#00BFFF" stroke-width="0.8" stroke-opacity="0.5" filter="url(#glow2)">
    <animate attributeName="y" values="145;138;145" dur="4s" repeatCount="indefinite"/>
  </rect>
  <text x="61" y="170" text-anchor="middle" font-family="monospace" font-size="7" fill="#00BFFF" letter-spacing="0.5">
    <animate attributeName="y" values="170;163;170" dur="4s" repeatCount="indefinite"/>
    AI READY
  </text>
  <text x="61" y="182" text-anchor="middle" font-family="monospace" font-size="8" fill="#F5C451" font-weight="700">
    <animate attributeName="y" values="182;175;182" dur="4s" repeatCount="indefinite"/>
    99.2%
  </text>

  <!-- Right card: Network card -->
  <rect x="383" y="155" width="72" height="50" rx="8" fill="#07152F" stroke="#F5C451" stroke-width="0.8" stroke-opacity="0.5" filter="url(#glow2)">
    <animate attributeName="y" values="155;148;155" dur="5s" repeatCount="indefinite" begin="1s"/>
  </rect>
  <text x="419" y="178" text-anchor="middle" font-family="monospace" font-size="7" fill="#F5C451" letter-spacing="0.5">
    <animate attributeName="y" values="178;171;178" dur="5s" repeatCount="indefinite" begin="1s"/>
    LATENCY
  </text>
  <text x="419" y="190" text-anchor="middle" font-family="monospace" font-size="8" fill="#00BFFF" font-weight="700">
    <animate attributeName="y" values="190;183;190" dur="5s" repeatCount="indefinite" begin="1s"/>
    11ms
  </text>

  <!-- Learn • Build • Grow pillars at bottom -->
  <rect x="60" y="300" width="100" height="50" rx="8" fill="rgba(7,89,199,0.15)" stroke="rgba(7,89,199,0.35)" stroke-width="1"/>
  <text x="110" y="322" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#00BFFF" font-weight="700">Learn</text>
  <text x="110" y="338" text-anchor="middle" font-family="monospace" font-size="8" fill="#4A6080">Foundation Skills</text>

  <rect x="190" y="300" width="100" height="50" rx="8" fill="rgba(245,196,81,0.12)" stroke="rgba(245,196,81,0.3)" stroke-width="1"/>
  <text x="240" y="322" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#F5C451" font-weight="700">Build</text>
  <text x="240" y="338" text-anchor="middle" font-family="monospace" font-size="8" fill="#4A6080">Real Projects</text>

  <rect x="320" y="300" width="100" height="50" rx="8" fill="rgba(168,85,247,0.12)" stroke="rgba(168,85,247,0.3)" stroke-width="1"/>
  <text x="370" y="322" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#A855F7" font-weight="700">Grow</text>
  <text x="370" y="338" text-anchor="middle" font-family="monospace" font-size="8" fill="#4A6080">Career Ready</text>
</svg>
