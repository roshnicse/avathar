<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="cyberBlueIcon2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00BFFF" />
      <stop offset="100%" stop-color="#0759C7" />
    </linearGradient>
    <linearGradient id="goldGlowIcon2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="100%" stop-color="#F5C451" />
    </linearGradient>
    <filter id="neonFavGlow2" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Hexagon border -->
  <polygon points="50,6 90,27 90,73 50,94 10,73 10,27" fill="#07152F" stroke="#00BFFF" stroke-width="2" opacity="0.9" />
  <circle cx="50" cy="50" r="42" fill="none" stroke="#0759C7" stroke-width="1" stroke-dasharray="6 4" opacity="0.6" />
  
  <!-- Stylized Futuristic 'A' -->
  <path d="M50 18 L24 78 L34 78 L50 40 Z" fill="url(#cyberBlueIcon2)" />
  <path d="M50 18 L76 78 L66 78 L50 40 Z" fill="url(#goldGlowIcon2)" />
  
  <!-- Neural Bridge -->
  <path d="M33 58 L67 58" stroke="url(#goldGlowIcon2)" stroke-width="4" stroke-linecap="round" filter="url(#neonFavGlow2)" />
  
  <!-- Glowing Nodes -->
  <circle cx="50" cy="18" r="4.5" fill="#FFE082" filter="url(#neonFavGlow2)" />
  <circle cx="24" cy="78" r="3.5" fill="#00BFFF" />
  <circle cx="76" cy="78" r="3.5" fill="#F5C451" />
  <circle cx="50" cy="58" r="3" fill="#FFFFFF" />
  
  <!-- Tech nodes -->
  <line x1="50" y1="18" x2="35" y2="30" stroke="#00BFFF" stroke-width="1.5" />
  <line x1="50" y1="18" x2="65" y2="30" stroke="#FFE082" stroke-width="1.5" />
  <circle cx="35" cy="30" r="2" fill="#00BFFF" />
  <circle cx="65" cy="30" r="2" fill="#F5C451" />
</svg>
